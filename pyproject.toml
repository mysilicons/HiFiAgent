[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hifi-agent"
version = "3.0.0"
description = "Native constrained PacBio HiFi genome assembly assistant."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "HiFi Agent contributors" },
]
dependencies = [
  "jinja2>=3.1,<4",
  "pydantic>=2",
  "pypdf>=5,<7",
  "pyyaml>=6",
  "rich>=13",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov>=5,<7",
  "ruff>=0.5",
  "types-PyYAML",
]

[project.scripts]
hifi-agent = "hifi_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hifi_agent.data" = [
  "comparison_policy.yaml",
  "knowledge/*.json",
  "workflow/*.config",
  "workflow/*.nf",
  "workflow/conf/*.config",
]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "real_acceptance: release-only tests against real biological data and live services",
]

[tool.coverage.run]
source = ["hifi_agent"]
omit = ["*/fixture-bin/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
omit = ["*/fixture-bin/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PT",
  "RUF",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["typer.*"]
disallow_untyped_decorators = false
