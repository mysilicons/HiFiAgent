name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Unit tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85

      - name: Portable README demo
        run: hifi-agent demo-v2 /tmp/hifi-agent-v2-demo

  nextflow-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Nextflow
        env:
          NXF_VER: "25.04.7"
        run: |
          cd /tmp
          curl -fsSL https://get.nextflow.io -o nextflow
          sudo install -m 0755 nextflow /usr/local/bin/nextflow
          nextflow -version

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify interrupted workflow resume
        run: pytest tests/workflow/test_nextflow_resume_acceptance.py
