name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Unit tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85

      - name: Portable README demo
        run: python scripts/run_portable_demo.py --workspace /tmp/hifi-agent-portable --scenario three-rounds

      - name: Build release distributions
        run: python -m build

      - name: Verify isolated wheel execution
        run: |
          target="$(mktemp -d)"
          workspace="$(mktemp -d)"
          python -m pip install --no-deps --target "$target" dist/hifi_agent-3.0.0-py3-none-any.whl
          PYTHONPATH="$target" python scripts/run_portable_demo.py \
            --installed-package \
            --workspace "$workspace" \
            --scenario three-rounds

  nextflow-resume:
    runs-on: ubuntu-latest
    env:
      NXF_VER: "25.04.7"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Nextflow
        run: |
          cd /tmp
          curl -fsSL https://get.nextflow.io -o nextflow
          sudo install -m 0755 nextflow /usr/local/bin/nextflow
          nextflow -version

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify interrupted workflow resume
        run: |
          set +e
          output="$(pytest -vv tests/workflow/test_nextflow_resume_acceptance.py 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            escaped="${output//'%'/'%25'}"
            escaped="${escaped//$'\r'/'%0D'}"
            escaped="${escaped//$'\n'/'%0A'}"
            printf '::error title=Nextflow resume test failed::%s\n' "$escaped"
            exit "$status"
          fi
